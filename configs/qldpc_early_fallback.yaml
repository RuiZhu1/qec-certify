  - name: twenty_fallback
    decoder: relay_bp_fallback
    relay_bp:
      implementation: f32
      gamma0: 0.125
      pre_iter: 40
      num_sets: 20
      set_max_iter: 40
      gamma_dist_interval: [-0.24, 0.66]
      stop_nconv: 1
  - name: paper_fallback
    decoder: relay_bp_fallback
    relay_bp:
      implementation: f32
      gamma0: 0.125
      pre_iter: 80
      num_sets: 60
      set_max_iter: 60
      gamma_dist_interval: [-0.24, 0.66]
