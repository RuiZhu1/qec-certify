reference_circuit: bb144_d12_p0005
confidence: 0.95
validation_shots: 20
validation_latency_shots: 5
test_shots: 100
test_latency_shots: 10
latency_warmup: 5
baseline: bp_lsd
evaluate_all: true
fallback_decoder: bp_lsd
candidates:
