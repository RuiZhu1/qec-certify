# Fixed paper_like parameters selected at p=0.003; no retuning on these cells.
name: qldpc_robustness
reference_circuits: [bb144_d12_p0001, bb144_d12_p003, bb144_d12_p0005]
experiment_seeds: [20261124, 20261125]
shots: 200
confidence: 0.95
decoders: [bp_lsd, relay_bp]
bp_lsd:
  max_iter: 100
  lsd_order: 0
  lsd_method: LSD_0
  omp_thread_count: 1
relay_bp:
  gamma0: 0.125
  pre_iter: 80
  num_sets: 60
  set_max_iter: 60
  gamma_dist_interval: [-0.24, 0.66]
  stop_nconv: 1
latency_shots: 10
latency_warmup: 5
