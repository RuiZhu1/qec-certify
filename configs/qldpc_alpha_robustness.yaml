# Pre-registered alpha robustness: alpha=None vs 0.90, with all other settings fixed.
name: qldpc_alpha_robustness
reference_circuits: [bb144_d12_p0001, bb144_d12_p003, bb144_d12_p0005]
experiment_seeds: [20261124, 20261125]
shots: 200
confidence: 0.95
latency_shots: 10
latency_warmup: 5
profile_shots: 20
profile_warmup: 2
candidates:
  - name: alpha_none
    relay_bp:
      implementation: f32
      gamma0: 0.125
      pre_iter: 80
      num_sets: 60
      set_max_iter: 60
      gamma_dist_interval: [-0.24, 0.66]
      stop_nconv: 1
  - name: alpha_0_90
    relay_bp:
      implementation: f32
      alpha: 0.90
      gamma0: 0.125
      pre_iter: 80
      num_sets: 60
      set_max_iter: 60
      gamma_dist_interval: [-0.24, 0.66]
      stop_nconv: 1
