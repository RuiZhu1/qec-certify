[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "qec-certify"
version = "0.1.0.dev0"
description = "Learned quantum error-correction decoders with optimality certificates."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "stim>=1.13",
    "pymatching>=2.2",
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.2",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qec_certify"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: long-running tests (deselect with '-m \"not slow\"')",
]
